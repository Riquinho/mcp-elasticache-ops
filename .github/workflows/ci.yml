name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      integration:
        description: "Run the live-server integration jobs"
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * 1"  # weekly, Monday 05:17 UTC

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: No build artifacts or env files tracked
        shell: bash
        run: |
          bad=$(git ls-files | grep -E '\.pyc$|(^|/)\.coverage|(^|/)\.env' || true)
          if [ -n "$bad" ]; then echo "tracked files that must not be committed:" >&2; echo "$bad" >&2; exit 1; fi
      - run: uv sync --locked
      - name: Lockfile is current
        run: uv lock --check
      - name: Dependency audit
        run: uv export --locked --no-hashes --no-emit-project -o /tmp/req.txt && uvx pip-audit --disable-pip --no-deps -r /tmp/req.txt
        shell: bash
      - name: Release check (CHANGELOG entry for the version, README tool table matches the registry)
        run: bash scripts/release-check.sh
      - name: Generated files are current (docs/iam-matrix.md, tests/tool_schemas.json)
        run: |
          uv run python -I scripts/regen.py
          git diff --exit-code -- docs/iam-matrix.md tests/tool_schemas.json
        shell: bash
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Build wheel and smoke test it in an isolated interpreter
        shell: bash
        run: |
          uv build
          uv run --no-project --isolated --with dist/*.whl python -I -c 'import mcp_elasticache_ops'
          uv run --no-project --isolated --with dist/*.whl python -I -m mcp_elasticache_ops --help
          uv run --no-project --isolated --with dist/*.whl mcp-elasticache-ops --help
      - name: Artifact contents (no .env, .coverage, .lotes, keys; py.typed shipped)
        run: bash scripts/check-artifacts.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["valkey/valkey:8-alpine", "redis:7-alpine"]
        python: ["3.12", "3.13"]
    services:
      redis:
        image: ${{ matrix.image }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
      memcached:
        image: memcached:1.6-alpine
        ports: ["11211:11211"]
    env:
      REDIS_TEST_URL: redis://localhost:6379/0
      MEMCACHED_TEST_HOST: localhost
      MEMCACHED_TEST_PORT: "11211"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Runs unit and integration tests, including the live Memcached test (MEMCACHED_TEST_HOST is set).
      - run: uv run pytest -q -rs --cov=mcp_elasticache_ops --cov-fail-under=93 --junitxml=junit.xml
      - name: Pass count is not below the recorded floor (tests/pass_floor.txt)
        run: uv run python -I scripts/check-pass-floor.py junit.xml
      - name: Skip count is not above the recorded ceiling (tests/skip_budget.txt)
        run: uv run python -I scripts/check-skip-budget.py junit.xml

  cluster:
    # always on push, schedule and dispatch; on a pull request only with the `integration` label
    if: >-
      github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f tests/docker-compose.cluster.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Start 3-node valkey cluster
        run: $COMPOSE up -d --wait --wait-timeout 90
      - name: Cluster integration tests
        env:
          CLUSTER_TEST_HOST: 127.0.0.1
          CLUSTER_TEST_PORT: "7001"
        # covers CLUSTER NODES, node_cluster_health and the keyspace/memory/slowlog fan-out against real nodes
        run: uv run pytest -q -m integration tests/test_dataplane_integration.py -k cluster
      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans

  secrets:
    # scans the full git history for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pinned release, checksum verified)
        shell: bash
        run: |
          v=8.28.0
          curl -sSfL -o g.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o g.sum "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt"
          want=$(awk -v f="gitleaks_${v}_linux_x64.tar.gz" '$2 == f { print $1 }' g.sum)
          test -n "$want"
          echo "$want  g.tgz" | sha256sum -c -
          tar -xzf g.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
