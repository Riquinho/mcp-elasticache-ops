[project]
name = "mcp-elasticache-ops"
version = "0.3.0"
description = "Read-only MCP server for Amazon ElastiCache (Redis OSS, Valkey, Memcached) operations and monitoring"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
keywords = ["mcp", "elasticache", "redis", "valkey", "memcached", "sre", "dbre"]
authors = [
    { name = "João Rito", email = "16895040+ritojoao@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.1",
    "fastmcp>=4.1.8",
    "redis>=8.1.0",
]

[project.scripts]
mcp-elasticache-ops = "mcp_elasticache_ops.server:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[cloudwatch]>=5.2.5",
    "mypy>=1.13",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a live Redis/Valkey (REDIS_TEST_URL) or Memcached (MEMCACHED_TEST_HOST)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["C408"]

[tool.ruff.lint.per-file-ignores]
"src/mcp_elasticache_ops/server.py" = ["E501"]
"src/mcp_elasticache_ops/controlplane/*.py" = ["E501"]  # long finding messages
"src/mcp_elasticache_ops/config.py" = ["E501"]  # long error messages

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["mcp_elasticache_ops"]
branch = true

[tool.coverage.report]
fail_under = 93
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
